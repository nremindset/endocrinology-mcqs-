<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endocrinology MCQ Quiz</title>
<style>
:root {
  --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#64748b;
  --accent:#4f46e5; --border:#dbe1ea; --good:#15803d; --bad:#b91c1c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
.wrap{max-width:850px;margin:auto;padding:24px 16px 48px}
header{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;border-radius:20px;padding:28px 24px;margin-bottom:18px;box-shadow:0 10px 30px #0001}
h1{margin:0 0 8px;font-size:clamp(26px,5vw,38px)} header p{margin:0;opacity:.9}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0;flex-wrap:wrap}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;flex:1;min-width:180px}
.bar{height:100%;background:var(--accent);width:0%;transition:.25s}
.counter{color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 5px 18px #00000008}
.qnum{font-size:13px;color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:.06em}
.question{font-size:21px;line-height:1.45;margin:10px 0 22px;font-weight:750}
.option{display:block;width:100%;text-align:left;background:white;border:2px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0;font-size:16px;cursor:pointer;transition:.15s}
.option:hover{border-color:#a5b4fc;background:#f8f7ff}
.option.selected{border-color:var(--accent);background:#eef2ff}
.option.correct{border-color:var(--good);background:#ecfdf5}
.option.wrong{border-color:var(--bad);background:#fef2f2}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
button.nav{border:0;border-radius:11px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--accent);color:white}
button.nav:disabled{opacity:.4;cursor:not-allowed}
#result{display:none;text-align:center}
.score{font-size:52px;font-weight:900;color:var(--accent)}
.review{text-align:left;margin-top:24px}
.review-item{padding:14px;border:1px solid var(--border);border-radius:12px;margin:10px 0}
.restart{margin-top:18px}
.small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Endocrinology MCQ Quiz</h1>
<p>Choose the best answer for each question. Your score is shown at the end.</p>
</header>
<div id="quiz">
  <div class="top"><div class="counter" id="counter"></div><div class="progress"><div class="bar" id="bar"></div></div></div>
  <div class="card">
    <div class="qnum" id="qnum"></div>
    <div class="question" id="question"></div>
    <div id="options"></div>
    <div class="actions">
      <button class="nav" id="prev" onclick="prevQ()">Previous</button>
      <button class="nav" id="next" onclick="nextQ()">Next</button>
    </div>
  </div>
</div>
<div id="result" class="card">
  <h2>Quiz complete 🎉</h2>
  <div class="score" id="score"></div>
  <p id="summary"></p>
  <div class="review" id="review"></div>
  <button class="nav restart" onclick="restart()">Try Again</button>
</div>
</div>
<script>

phonate", "Calcitonin"]}, {"question": "A patient has hypercalcemia, low PTH, and multiple lytic bone lesions. The most likely cause is:", "options": ["Primary hyperparathyroidism", "Multiple myeloma", "Hypoparathyroidism", "Vitamin D deficiency"]}, {"question": "A patient with severe hypercalcemia develops dehydration, constipation, and confusion. Initial management includes:", "options": ["IV isotonic saline", "Fluid restriction", "Oral calcium", "Desmopressin"]}, {"question": "A patient has fatigue, weight loss, hyperpigmentation, hypotension, hyponatremia, and hyperkalemia. Diagnosis?", "options": ["Cushing syndrome", "Primary adrenal insufficiency", "Hyperaldosteronism", "Pheochromocytoma"]}, {"question": "In suspected adrenal crisis, treatment should begin with:", "options": ["Oral fludrocortisone only", "IV hydrocortisone and isotonic saline", "Dexamethasone suppression test", "Methimazole"]}, {"question": "A patient has low cortisol, low ACTH, and no hyperpigmentation. Diagnosis?", "options": ["Primary adrenal insufficiency", "Secondary adrenal insufficiency", "Pheochromocytoma", "Congenital adrenal hyperplasia"]}, {"question": "The best initial screening test for Cushing syndrome is:", "options": ["Random serum cortisol", "Overnight dexamethasone suppression test", "Serum aldosterone", "Plasma renin alone"]}, {"question": "A patient has central obesity, purple striae, proximal muscle weakness, hypertension, and diabetes. Most likely diagnosis?", "options": ["Addison disease", "Cushing syndrome", "Conn syndrome", "Hypopituitarism"]}, {"question": "A patient has hypertension, hypokalemia, metabolic alkalosis, low renin, and high aldosterone. Diagnosis?", "options": ["Renal artery stenosis", "Primary hyperaldosteronism", "Addison disease", "SIADH"]}, {"question": "The most appropriate confirmatory test for primary hyperaldosteronism is:", "options": ["Aldosterone-to-renin ratio", "24-hour urinary cortisol", "Dexamethasone suppression test", "Water deprivation lpha blocker"]}, {"question": "A diabetic patient has burning pain and numbness in both feet. First-line treatment for painful neuropathy includes:", "options": ["Gabapentin or duloxetine", "Warfarin", "Furosemide", "Amoxicillin"]}, {"question": "A diabetic patient has a painless plantar ulcer with loss of sensation. The main cause is:", "options": ["Peripheral neuropathy", "Acute gout", "Venous insufficiency", "Cellulitis alone"]}, {"question": "A patient with acromegalic facial features has an elevated IGF-1 level. The next diagnostic test is:", "options": ["Oral glucose tolerance test with growth hormone measurement", "Water deprivation test", "Dexamethasone suppression test", "Serum prolactin only"]}, {"question": "The most common cause of acromegaly is:", "options": ["Adrenal adenoma", "Pituitary somatotroph adenoma", "Thyroid carcinoma", "Hypothalamic infarction"]}, {"question": "A patient has enlarged hands, prognathism, sweating, and sleep apnea. Definitive first-line treatment for a resectable pituitary tumor is:", "options": ["Transsphenoidal surgery", "Radioactive iodine", "Bilateral adrenalectomy", "Lifelong steroids only"]}, {"question": "A patient with polyuria and polydipsia has high serum sodium and dilute urine. Urine concentrates dramatically after desmopressin. Diagnosis?", "options": ["Nephrogenic diabetes insipidus", "Central diabetes insipidus", "SIADH", "Primary polydipsia"]}, {"question": "The most common cause of nephrogenic diabetes insipidus is:", "options": ["Lithium therapy", "Pituitary adenoma", "Head trauma", "Hyperthyroidism"]}, {"question": "A patient has hyponatremia, low serum osmolality, concentrated urine, and euvolemia. Diagnosis?", "options": ["Diabetes insipidus", "SIADH", "Primary hyperaldosteronism", "Diabetes mellitus"]}, {"question": "Severe symptomatic hyponatremia with seizures should be treated with:", "options": ["Hypertonic saline", "Oral water", "Desmopressin alone", "Isotonic glucose solution"]}, {"question": "A patient with a pituitary macroadenoma develops sudden severe headache, visual loss, and ophthalmoplegia. Diagnosis?", "options": ["Pituitary apoplexy", "Migraine", "Meningitis", "Optic neuritis"]}, {"question": "The immediate treatment of suspected pituitary apoplexy is:", "options": ["IV hydrocortisone", "Methimazole", "Oral calcium", "Insulin infusion"]}, {"question": "A patient has galactorrhea, amenorrhea, and elevated prolactin. The most likely diagnosis is:", "options": ["Prolactinoma", "Pheochromocytoma", "Diabetes insipidus", "Adrenal adenoma"]}, {"question": "First-line treatment for a prolactinoma is:", "options": ["Cabergoline", "Transsphenoidal surgery in every case", "Radioactive iodine", "Ketoconazole"]}, {"question": "A patient has obesity, purple striae, hypertension, and high ACTH. MRI reveals a pituitary microadenoma. Diagnosis?", "options": ["Cushing disease", "Addison disease", "Conn syndrome", "Pheochromocytoma"]}, {"question": "The best screening test for Cushing syndrome is:", "options": ["24-hour urinary free cortisol", "Serum aldosterone", "Plasma renin activity", "Serum calcitonin"]}, {"question": "A patient has hypertension, hypokalemia, metabolic alkalosis, low renin, and high aldosterone. Diagnosis?", "options": ["Primary hyperaldosteronism", "Addison disease", "SIADH", "Diabetes insipidus"]}, {"question": "The confirmatory test for primary hyperaldosteronism is:", "options": ["Saline infusion or oral salt-loading test", "Water deprivation test", "Dexamethasone suppression test", "ACTH stimulation test"]}, {"question": "A patient has episodic headache, sweating, palpitations, and hypertension. The best initial test is:", "options": ["Plasma free metanephrines", "Serum TSH", "Urine glucose", "Serum calcium"]}, {"question": "Before surgery for pheochromocytoma, the correct medication sequence is:", "options": ["Beta blockade followed by alpha blockade", "Alpha blockade followed by beta blockade", "Calcium followed by insulin", "Diuretics followed by beta blockade"]}, {"question": "A patient has hypercalcemia, kidney stones, bone pain, and elevated PTH. Diagnosis?", "options": ["Primary hyperparathyroidism", "Hypoparathyroidism", "Vitamin D deficiency", "SIADH"]}, {"question": "The most common cause of primary hyperparathyroidism is:", "options": ["Parathyroid adenoma", "Parathyroid carcinoma", "Chronic renal failure", "Vitamin D toxicity"]}, {"question": "A patient develops perioral tingling, carpopedal spasm, and prolonged QT after thyroid surgery. Treatment?", "options": ["IV calcium gluconate", "Oral phosphate", "IV insulin", "Methimazole"]}, {"question": "Chronic kidney disease commonly causes secondary hyperparathyroidism due to:", "options": ["Hypercalcemia and increased vitamin D", "Hypocalcemia and phosphate retention", "Excess calcitonin", "Increased intestinal calcium absorption"]}, {"question": "The most common cause of hyperthyroidism worldwide is:", "options": ["Graves disease", "Hashimoto thyroiditis", "Subacute thyroiditis", "Thyroid lymphoma"]}, {"question": "Graves disease is associated with:", "options": ["TSH-receptor antibodies", "Anti-insulin antibodies", "Anti-mitochondrial antibodies", "Anti-GBM antibodies"]}, {"question": "A patient with thyrotoxicosis has painful thyroid swelling and elevated ESR. Diagnosis?", "options": ["Subacute granulomatous thyroiditis", "Graves disease", "Toxic multinodular goiter", "Thyroid carcinoma"]}, {"question": "The treatment of painful subacute thyroiditis is:", "options": ["NSAIDs or corticosteroids", "Radioactive iodine immediately", "Lifelong levothyroxine immediately", "Thyroidectomy"]}, {"question": "The most common cause of hypothyroidism in iodine-sufficient regions is:", "options": ["Hashimoto thyroiditis", "Graves disease", "Pituitary adenoma", "Pheochromocytoma"]}, {"question": "The characteristic antibody in Hashimoto thyroiditis is:", "options": ["Anti-thyroid peroxidase antibody", "Anti-dsDNA antibody", "Anti-CCP antibody", "Anti-ACh receptor antibody"]}, {"question": "A patient with severe hypothyroidism has hypothermia, bradycardia, confusion, and hypoventilation. Diagnosis?", "options": ["Myxedema coma", "Thyroid storm", "Adrenal crisis", "Septic shock"]}, {"question": "Initial treatment of myxedema coma includes:", "options": ["IV levothyroxine and hydrocortisone", "Methimazole only", "Radioactive iodine", "Oral calcium only"]}, {"question": "A patient with fever, delirium, vomiting, tachycardia, and thyrotoxicosis has thyroid storm. First-line therapy includes:", "options": ["Beta blocker, thionamide, iodine, and corticosteroid", "Levothyroxine alone", "Calcium gluconate only", "Immediate thyroidectomy in all cases"]}, {"question": "Iodine should be administered in thyroid storm:", "options": ["Before the thionamide", "After the thionamide", "Instead of the thionamide", "Only after thyroidectomy"]}, {"question": "The most common cause of an adrenal crisis is:", "options": ["Sudden withdrawal of chronic glucocorticoids", "Excess insulin", "Hyperthyroidism", "Primary hyperparathyroidism"]}, {"question": "A patient with hypotension, hyponatremia, hyperkalemia, hypoglycemia, and hyperpigmentation has:", "options": ["Primary adrenal insufficiency", "Secondary adrenal insufficiency", "Cushing syndrome", "Primary hyperaldosteronism"]}];
let current = 0;
let answers = Array(questions.length).fill(null);
const letters = ["A","B","C","D"];

function render() {
  const q = questions[current];
  document.getElementById("counter").textContent = `Question ${current+1} of ${questions.length}`;
  document.getElementById("qnum").textContent = `Question ${current+1}`;
  document.getElementById("question").textContent = q.question;
  const box = document.getElementById("options");
  box.innerHTML = "";
  q.options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="option"+(answers[current]===i?" selected":"");
    b.textContent=letters[i]+". "+opt;
    b.onclick=()=>{answers[current]=i;render();};
    box.appendChild(b);
  });
  document.getElementById("prev").disabled=current===0;
  document.getElementById("next").textContent=current===questions.length-1?"Finish":"Next";
  document.getElementById("bar").style.width=((current+1)/questions.length*100)+"%";
}
function nextQ(){
  if(answers[current]===null){alert("Please choose an answer first.");return;}
  if(current<questions.length-1){current++;render();}else showResult();
}
function prevQ(){if(current>0){current--;render();}}
function showResult(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").style.display="block";
  // Answer key is intentionally not embedded because the uploaded document contains questions/options only.
  const answered=answers.filter(x=>x!==null).length;
  document.getElementById("score").textContent=`${answered} / ${questions.length}`;
  document.getElementById("summary").textContent="You answered every question. This version records selections but does not mark correct answers because the source document does not provide an answer key.";
  document.getElementById("review").innerHTML='<p class="small">To add automatic right/wrong marking, provide the answer key and I can update the site.</p>';
}
function restart(){
  current=0; answers=Array(questions.length).fill(null);
  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="block";
  render();
}
render();
</script>
</body>
</html>
